<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني – معلومات جهازك</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e14;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #0d1117;
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid #2a3340;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #ff4d4d;
            font-size: 28px;
            border-bottom: 2px solid #2a3340;
            padding-bottom: 15px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .sub-badge {
            display: block;
            text-align: center;
            color: #ff6b6b;
            background: #1e1a2b;
            padding: 6px 0;
            border-radius: 30px;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 25px;
            border: 1px dashed #ff6b6b44;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #0f161c;
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 4px solid #f0883e;
            transition: 0.2s;
        }
        .card:hover {
            background: #1a232b;
            border-left-color: #ff6b6b;
        }
        .card .label {
            font-size: 11px;
            color: #7a8696;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: #e6edf3;
            word-break: break-word;
        }
        .full {
            grid-column: span 2;
        }

        .camera-section {
            margin: 20px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #video {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            border: 2px solid #2a3340;
            background: #000;
            transform: scaleX(-1);
            display: none;
        }
        #captured-image {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            border: 2px solid #ff4d4d55;
            transform: scaleX(-1);
            display: block;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }
        .photo-notice {
            font-size: 13px;
            color: #ff6b6b;
            background: #1e0f0f;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #ff4d4d33;
        }

        /* زر التفعيل للجوال */
        .activate-btn {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.3);
            margin: 10px 0;
            display: none; /* مخفي افتراضياً */
        }
        .activate-btn:hover {
            background: #ff3333;
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(255, 77, 77, 0.5);
        }
        .activate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* رسالة انتظار */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(8px);
        }
        .loading-overlay h2 {
            color: #ff6b6b;
            font-size: 24px;
        }
        .loading-overlay p {
            color: #c9d1d9;
            font-size: 16px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a3340;
            border-top: 4px solid #ff4d4d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .warning-box {
            background: #1e0f0f;
            border: 1px solid #ff3b3b55;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0 10px;
            text-align: center;
            color: #ff8a8a;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5a6a;
            margin-top: 20px;
            border-top: 1px solid #1a222a;
            padding-top: 15px;
        }
        @media (max-width: 550px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
        }
    </style>
</head>
<body>

<!-- ===== طبقة التحميل ===== -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <h2>⏳ جارٍ التحميل...</h2>
    <p id="loadingText">يرجى الانتظار، سيتم تفعيل الإشعارات والكاميرا</p>
</div>

<div class="container">
    <h1>⚠️ تنبيه أمني</h1>
    <span class="sub-badge">🔍 تم جمع هذه البيانات من جهازك</span>

    <div class="grid" id="infoGrid">
        <!-- البيانات تظهر هنا عبر JavaScript -->
    </div>

    <div class="camera-section">
        <!-- زر التفعيل (يظهر فقط للجوال) -->
        <button class="activate-btn" id="activateBtn">📱 تفعيل الإشعارات والكاميرا</button>

        <video id="video" autoplay playsinline></video>
        <img id="captured-image" alt="تم التقاط صورتك تلقائياً">
        <span class="photo-notice">📸 تم التقاط صورة من كاميرتك الأمامية تلقائياً</span>
    </div>

    <div class="warning-box">
        ⚡ هذه مجرد محاكاة – المخترق الحقيقي يمكنه تشغيل كاميرتك وميكروفونك دون علمك
    </div>
    <div class="footer">
        cybernestsec © 2026
    </div>
</div>

<script>
    // ==========================================
    // الكشف عن نوع الجهاز
    // ==========================================
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    // ==========================================
    // 1. طلب صلاحية الإشعارات والكاميرا
    // ==========================================
    async function requestPermissions() {
        if ('Notification' in window && Notification.permission === 'default') {
            await Notification.requestPermission();
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
            });
            return stream;
        } catch (err) {
            return null;
        }
    }

    // ==========================================
    // 2. تشغيل الكاميرا والتصوير
    // ==========================================
    async function capturePhoto() {
        const stream = await requestPermissions();
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'none';

        const video = document.getElementById('video');
        const capturedImg = document.getElementById('captured-image');

        if (stream) {
            video.srcObject = stream;
            await new Promise(resolve => setTimeout(resolve, 500));

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImg.src = canvas.toDataURL('image/png');

            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
        } else {
            capturedImg.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240"%3E%3Crect width="320" height="240" fill="%231a1a2e"/%3E%3Ctext x="40" y="120" font-family="Arial" font-size="18" fill="%23ff6b6b"%3E⚠️ تم رفض الكاميرا%3C/text%3E%3C/svg%3E';
        }
    }

    // ==========================================
    // 3. جمع المعلومات
    // ==========================================
    const ua = navigator.userAgent;

    let os = 'غير معروف';
    if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
    else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
    else if (ua.includes('Mac OS X')) os = 'macOS';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
    else if (ua.includes('Linux')) os = 'Linux';

    let browser = 'غير معروف';
    if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Google Chrome';
    else if (ua.includes('Firefox')) browser = 'Mozilla Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Microsoft Edge';
    else if (ua.includes('Opera') || ua.includes('OPR')) browser = 'Opera';

    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', { hour12: true });
    const screenRes = `${window.screen.width} × ${window.screen.height}`;
    const colorDepth = `${window.screen.colorDepth} بت`;
    const memory = navigator.deviceMemory ? `${navigator.deviceMemory} جيجابايت` : 'غير متاحة';
    const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} نواة` : 'غير متاح';
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    let isPrivate = 'غير معروف';
    if (navigator.webdriver) {
        isPrivate = 'ربما (متصفح آلي)';
    } else {
        try {
            const fs = window.RequestFileSystem || window.webkitRequestFileSystem;
            if (!fs) isPrivate = 'ربما (غير مدعوم)';
        } catch(e) { isPrivate = 'محتمل'; }
    }

    let batteryInfo = '⏳ جارٍ الجلب...';
    if (navigator.getBattery) {
        navigator.getBattery().then(b => {
            batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? '🔌 شحن' : '🔋 بطارية'})`;
            const el = document.getElementById('battery');
            if (el) el.textContent = batteryInfo;
        }).catch(() => { batteryInfo = 'غير متاحة'; });
    }

    let connectionType = 'غير معروف';
    if (navigator.connection) {
        const c = navigator.connection;
        connectionType = c.effectiveType || c.type || 'غير معروف';
    }

    // ==========================================
    // 4. عرض البيانات
    // ==========================================
    const data = [
        { label: 'نظام التشغيل', value: os },
        { label: 'المتصفح', value: browser },
        { label: 'التوقيت المحلي', value: timeStr },
        { label: 'دقة الشاشة', value: screenRes },
        { label: 'عمق الألوان', value: colorDepth },
        { label: 'الذاكرة (RAM)', value: memory },
        { label: 'عدد النوى', value: cores },
        { label: 'المنطقة الزمنية', value: timezone },
        { label: 'نوع الاتصال', value: connectionType },
        { label: 'وضع التصفح', value: isPrivate },
        { label: 'البطارية', value: batteryInfo, id: 'battery' }
    ];

    const grid = document.getElementById('infoGrid');
    data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `card ${index === data.length - 1 ? 'full' : ''}`;
        div.innerHTML = `
            <div class="label">${item.label}</div>
            <div class="value" ${item.id ? `id="${item.id}"` : ''}>${item.value}</div>
        `;
        grid.appendChild(div);
    });

    // ==========================================
    // 5. تشغيل الكاميرا حسب نوع الجهاز
    // ==========================================
    const activateBtn = document.getElementById('activateBtn');
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    if (isMobile) {
        // ===== جوال =====
        // إخفاء رسالة الانتظار التلقائي
        overlay.style.display = 'none';

        // إظهار الزر
        activateBtn.style.display = 'block';

        // عند الضغط على الزر
        activateBtn.addEventListener('click', async function() {
            this.disabled = true;
            this.textContent = '⏳ جارٍ التفعيل...';

            await capturePhoto();

            this.textContent = '✅ تم التفعيل بنجاح';
            this.style.background = '#2ea043';
        });

    } else {
        // ===== لابتوب / كمبيوتر =====
        // تشغيل تلقائي
        loadingText.textContent = 'جاري تشغيل الكاميرا تلقائياً...';
        await capturePhoto();
        overlay.style.display = 'none';
    }
</script>
</body>
</html>
