<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني – معلومات جهازك</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e14;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #0d1117;
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid #2a3340;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #ff4d4d;
            font-size: 28px;
            border-bottom: 2px solid #2a3340;
            padding-bottom: 15px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .sub-badge {
            display: block;
            text-align: center;
            color: #ff6b6b;
            background: #1e1a2b;
            padding: 6px 0;
            border-radius: 30px;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 25px;
            border: 1px dashed #ff6b6b44;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #0f161c;
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 4px solid #f0883e;
            transition: 0.2s;
        }
        .card:hover {
            background: #1a232b;
            border-left-color: #ff6b6b;
        }
        .card .label {
            font-size: 11px;
            color: #7a8696;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: #e6edf3;
            word-break: break-word;
        }
        .full {
            grid-column: span 2;
        }

        /* كاميرا */
        .camera-section {
            margin: 20px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #video {
            width: 100%;
            max-width: 350px;
            border-radius: 14px;
            border: 2px solid #2a3340;
            background: #000;
            transform: scaleX(-1); /* مرآة للكاميرا الأمامية */
        }
        #captured-image {
            width: 100%;
            max-width: 350px;
            border-radius: 14px;
            border: 2px solid #2a3340;
            display: none;
            transform: scaleX(-1);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .btn:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        .btn.danger {
            background: #4a1a1a;
            border-color: #ff4d4d;
            color: #ff8a8a;
        }
        .btn.danger:hover {
            background: #5a2020;
        }
        .btn.success {
            background: #1a3a2a;
            border-color: #3fb950;
            color: #7ee787;
        }
        .btn.success:hover {
            background: #1f4a2f;
        }

        .warning-box {
            background: #1e0f0f;
            border: 1px solid #ff3b3b55;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0 10px;
            text-align: center;
            color: #ff8a8a;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5a6a;
            margin-top: 20px;
            border-top: 1px solid #1a222a;
            padding-top: 15px;
        }
        @media (max-width: 550px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚠️ تنبيه أمني</h1>
    <span class="sub-badge">🔍 تم جمع هذه البيانات من جهازك</span>

    <div class="grid" id="infoGrid">
        <!-- البيانات تظهر هنا عبر JavaScript -->
    </div>

    <!-- ===== كاميرا السيلفي ===== -->
    <div class="camera-section">
        <video id="video" autoplay playsinline></video>
        <img id="captured-image" alt="صورتك">
        <div class="btn-group">
            <button class="btn" id="start-camera">📷 تشغيل الكاميرا</button>
            <button class="btn success" id="capture-btn">📸 التقاط صورة</button>
            <button class="btn danger" id="stop-camera">⛔ إيقاف الكاميرا</button>
        </div>
        <p style="font-size:13px;color:#7a8696;margin-top:5px;">
            ⚠️ تم التقاط صورة من كاميرتك الأمامية (محاكاة)
        </p>
    </div>

    <div class="warning-box">
        ⚡ هذه مجرد محاكاة – المخترق الحقيقي يمكنه تشغيل كاميرتك وميكروفونك دون علمك
    </div>
    <div class="footer"> cybernestsec © 2026
    </div>
</div>

<script>
    // ==========================================
    // 1. جمع المعلومات (بدون IP، بدون لغة، بدون نوع جهاز)
    // ==========================================
    const ua = navigator.userAgent;

    // نظام التشغيل
    let os = 'غير معروف';
    if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
    else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
    else if (ua.includes('Mac OS X')) os = 'macOS';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
    else if (ua.includes('Linux')) os = 'Linux';

    // المتصفح
    let browser = 'غير معروف';
    if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Google Chrome';
    else if (ua.includes('Firefox')) browser = 'Mozilla Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Microsoft Edge';
    else if (ua.includes('Opera') || ua.includes('OPR')) browser = 'Opera';

    // الوقت
    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', { hour12: true });

    // دقة الشاشة
    const screenRes = `${window.screen.width} × ${window.screen.height}`;

    // عمق الألوان
    const colorDepth = `${window.screen.colorDepth} بت`;

    // الذاكرة (RAM)
    const memory = navigator.deviceMemory ? `${navigator.deviceMemory} جيجابايت` : 'غير متاحة';

    // عدد النوى
    const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} نواة` : 'غير متاح';

    // المنطقة الزمنية
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // هل المتصفح في وضع التصفح الخفي؟
    let isPrivate = 'غير معروف';
    if (navigator.webdriver) {
        isPrivate = 'ربما (متصفح آلي)';
    } else {
        try {
            const fs = window.RequestFileSystem || window.webkitRequestFileSystem;
            if (!fs) isPrivate = 'ربما (غير مدعوم)';
        } catch(e) { isPrivate = 'محتمل'; }
    }

    // البطارية
    let batteryInfo = '⏳ جارٍ الجلب...';
    if (navigator.getBattery) {
        navigator.getBattery().then(b => {
            batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? '🔌 شحن' : '🔋 بطارية'})`;
            const el = document.getElementById('battery');
            if (el) el.textContent = batteryInfo;
        }).catch(() => { batteryInfo = 'غير متاحة'; });
    }

    // نوع الاتصال
    let connectionType = 'غير معروف';
    if (navigator.connection) {
        const c = navigator.connection;
        connectionType = c.effectiveType || c.type || 'غير معروف';
    }

    // ==========================================
    // 2. عرض البيانات (بدون IP، لغة، نوع جهاز)
    // ==========================================
    const data = [
        { label: 'نظام التشغيل', value: os },
        { label: 'المتصفح', value: browser },
        { label: 'التوقيت المحلي', value: timeStr },
        { label: 'دقة الشاشة', value: screenRes },
        { label: 'عمق الألوان', value: colorDepth },
        { label: 'الذاكرة (RAM)', value: memory },
        { label: 'عدد النوى', value: cores },
        { label: 'المنطقة الزمنية', value: timezone },
        { label: 'نوع الاتصال', value: connectionType },
        { label: 'وضع التصفح', value: isPrivate },
        { label: 'البطارية', value: batteryInfo, id: 'battery' }
    ];

    const grid = document.getElementById('infoGrid');
    data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `card ${index === data.length - 1 ? 'full' : ''}`;
        div.innerHTML = `
            <div class="label">${item.label}</div>
            <div class="value" ${item.id ? `id="${item.id}"` : ''}>${item.value}</div>
        `;
        grid.appendChild(div);
    });

    // ==========================================
    // 3. كاميرا السيلفي
    // ==========================================
    const video = document.getElementById('video');
    const capturedImg = document.getElementById('captured-image');
    const startBtn = document.getElementById('start-camera');
    const captureBtn = document.getElementById('capture-btn');
    const stopBtn = document.getElementById('stop-camera');
    let stream = null;

    // تشغيل الكاميرا (الأمامية)
    startBtn.addEventListener('click', async () => {
        try {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
            });
            video.srcObject = stream;
            video.style.display = 'block';
            capturedImg.style.display = 'none';
        } catch (err) {
            alert('تعذر الوصول إلى الكاميرا: ' + err.message);
        }
    });

    // التقاط صورة
    captureBtn.addEventListener('click', () => {
        if (!stream) {
            alert('يرجى تشغيل الكاميرا أولاً');
            return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        capturedImg.src = canvas.toDataURL('image/png');
        capturedImg.style.display = 'block';
        video.style.display = 'none';
    });

    // إيقاف الكاميرا
    stopBtn.addEventListener('click', () => {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        video.srcObject = null;
        video.style.display = 'none';
        capturedImg.style.display = 'none';
    });
</script>
</body>
</html>
