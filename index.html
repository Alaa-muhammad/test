<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني - معلومات جهازك</title>
    <style>
        /* === التصميم العام === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e14;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #0d1117;
            padding: 30px 25px;
            border-radius: 12px;
            border: 1px solid #2a3340;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
        }

        /* === العناوين === */
        h1 {
            text-align: center;
            color: #ff3b3b;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff3b3b55;
            border-bottom: 2px solid #2a3340;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .sub-badge {
            display: block;
            text-align: center;
            color: #ff6b6b;
            background: #1e1a2b;
            padding: 6px 0;
            border-radius: 30px;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 25px;
            border: 1px dashed #ff6b6b44;
        }

        /* === الشبكة === */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #0f161c;
            padding: 14px 16px;
            border-radius: 8px;
            border-left: 4px solid #f0883e;
            transition: 0.2s;
        }
        .card:hover {
            background: #1a232b;
            border-left-color: #ff6b6b;
        }
        .card .label {
            font-size: 11px;
            color: #7a8696;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .value {
            font-size: 15px;
            font-weight: 600;
            margin-top: 4px;
            color: #e6edf3;
            word-break: break-word;
        }
        .card .value.ip {
            color: #58a6ff;
            font-family: monospace;
            font-size: 17px;
        }
        .card .value.danger {
            color: #ff6b6b;
        }
        .full {
            grid-column: span 2;
        }

        /* === تحذير === */
        .warning-box {
            background: #1e0f0f;
            border: 1px solid #ff3b3b55;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0 10px;
            text-align: center;
            color: #ff8a8a;
            font-size: 15px;
        }

        /* === تذييل === */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5a6a;
            margin-top: 20px;
            border-top: 1px solid #1a222a;
            padding-top: 15px;
        }

        /* === جوال === */
        @media (max-width: 550px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚠️ تنبيه أمني</h1>
    <span class="sub-badge">🔍 تم جمع هذه البيانات من جهازك دون علمك</span>

    <div class="grid" id="infoGrid">
        <!-- البيانات تظهر هنا عبر JavaScript -->
    </div>

    <div class="warning-box">
        ⚡ هذه مجرد محاكاة – المخترق الحقيقي يستطيع جمع ملفاتك، وكلمات مرورك، وموقعك، والتجسس على كاميرتك وميكروفونك.
    </div>
    <div class="footer">
        ورشة الأمن السيبراني – جميع الحقوق محفوظة © 2026
    </div>
</div>

<script>
    // ==========================================
    // 1. جمع المعلومات
    // ==========================================
    const ua = navigator.userAgent;

    // نظام التشغيل
    let os = 'غير معروف';
    if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
    else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
    else if (ua.includes('Mac OS X')) os = 'macOS';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
    else if (ua.includes('Linux')) os = 'Linux';

    // المتصفح
    let browser = 'غير معروف';
    if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Google Chrome';
    else if (ua.includes('Firefox')) browser = 'Mozilla Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Microsoft Edge';
    else if (ua.includes('Opera') || ua.includes('OPR')) browser = 'Opera';

    // نوع الجهاز
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
    const device = isMobile ? '📱 جوال / جهاز لوحي' : '💻 كمبيوتر / لابتوب';

    // اللغة
    const lang = navigator.language || navigator.languages?.[0] || 'غير معروف';

    // الوقت
    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', { hour12: true });

    // دقة الشاشة
    const screenRes = `${window.screen.width} × ${window.screen.height}`;

    // عمق الألوان
    const colorDepth = `${window.screen.colorDepth} بت`;

    // الذاكرة (RAM)
    const memory = navigator.deviceMemory ? `${navigator.deviceMemory} جيجابايت` : 'غير متاحة';

    // عدد النوى
    const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} نواة` : 'غير متاح';

    // المنطقة الزمنية
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // هل المتصفح في وضع التصفح الخفي (Incognito)؟
    let isPrivate = 'غير معروف';
    if (navigator.webdriver) {
        isPrivate = 'ربما (متصفح آلي)';
    } else {
        try {
            const fs = window.RequestFileSystem || window.webkitRequestFileSystem;
            if (!fs) isPrivate = 'ربما (غير مدعوم)';
        } catch(e) { isPrivate = 'محتمل'; }
    }

    // معلومات البطارية
    let batteryInfo = '⏳ جارٍ الجلب...';
    if (navigator.getBattery) {
        navigator.getBattery().then(b => {
            batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? '🔌 شحن' : '🔋 بطارية'})`;
            const el = document.getElementById('battery');
            if (el) el.textContent = batteryInfo;
        }).catch(() => { batteryInfo = 'غير متاحة'; });
    }

    // نوع الاتصال
    let connectionType = 'غير معروف';
    if (navigator.connection) {
        const c = navigator.connection;
        connectionType = c.effectiveType || c.type || 'غير معروف';
    }

    // ==========================================
    // 2. عرض البيانات
    // ==========================================
    const data = [
        { label: 'نظام التشغيل', value: os, cls: '' },
        { label: 'المتصفح', value: browser, cls: '' },
        { label: 'نوع الجهاز', value: device, cls: '' },
        { label: 'اللغة', value: lang, cls: '' },
        { label: 'التوقيت المحلي', value: timeStr, cls: '' },
        { label: 'دقة الشاشة', value: screenRes, cls: '' },
        { label: 'عمق الألوان', value: colorDepth, cls: '' },
        { label: 'الذاكرة (RAM)', value: memory, cls: '' },
        { label: 'عدد النوى', value: cores, cls: '' },
        { label: 'المنطقة الزمنية', value: timezone, cls: '' },
        { label: 'نوع الاتصال', value: connectionType, cls: '' },
        { label: 'وضع التصفح', value: isPrivate, cls: '' },
        { label: 'البطارية', value: batteryInfo, cls: '', id: 'battery' }
    ];

    const grid = document.getElementById('infoGrid');
    data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `card ${index === data.length - 1 ? 'full' : ''}`;
        div.innerHTML = `
            <div class="label">${item.label}</div>
            <div class="value ${item.cls}" ${item.id ? `id="${item.id}"` : ''}>${item.value}</div>
        `;
        grid.appendChild(div);
    });

    // ==========================================
    // 3. جلب الـ IP
    // ==========================================
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => {
            const ipCard = document.createElement('div');
            ipCard.className = 'card full';
            ipCard.style.borderLeftColor = '#58a6ff';
            ipCard.innerHTML = `
                <div class="label">🌐 عنوان IP العام</div>
                <div class="value ip">${d.ip}</div>
            `;
            grid.appendChild(ipCard);
        })
        .catch(() => {
            const ipCard = document.createElement('div');
            ipCard.className = 'card full';
            ipCard.style.borderLeftColor = '#ff6b6b';
            ipCard.innerHTML = `
                <div class="label">🌐 عنوان IP العام</div>
                <div class="value danger">تعذر الحصول على IP</div>
            `;
            grid.appendChild(ipCard);
        });
</script>
</body>
</html>
