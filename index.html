<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني – معلومات جهازك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e14;
            color: #e6edf3;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #131a20;
            border-radius: 20px;
            padding: 30px 25px;
            border: 1px solid #2a3340;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            font-size: 30px;
            color: #ff6b6b;
            border-bottom: 2px solid #2a3340;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .sub {
            text-align: center;
            font-size: 14px;
            color: #b0b9c5;
            margin-top: -15px;
            margin-bottom: 25px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #0f161c;
            padding: 14px 16px;
            border-radius: 12px;
            border-left: 4px solid #f0883e;
            transition: 0.2s;
        }
        .card:hover {
            background: #1a232b;
        }
        .card .label {
            font-size: 12px;
            color: #88929e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card .value {
            font-size: 15px;
            font-weight: 600;
            margin-top: 4px;
            color: #e6edf3;
            word-break: break-word;
        }
        .card .value.ip {
            color: #58a6ff;
            font-family: monospace;
        }
        .card .value.danger {
            color: #ff6b6b;
        }
        .full {
            grid-column: span 2;
        }
        .warning-box {
            background: #1e1a2b;
            border: 1px solid #ff6b6b44;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0 10px;
            text-align: center;
            color: #ffa07a;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #5a6a7a;
            margin-top: 20px;
            border-top: 1px solid #1e2a33;
            padding-top: 15px;
        }
        .badge {
            display: inline-block;
            background: #ff6b6b22;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            color: #ff6b6b;
            margin-bottom: 8px;
        }
        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛡️ تنبيه أمني</h1>
    <div class="sub"><span class="badge">🔍 تم جمع هذه البيانات من جهازك دون إذنك</span></div>

    <div class="grid" id="infoGrid">
        <!-- سيتم ملء البطاقات بواسطة JavaScript -->
    </div>

    <div class="warning-box">
        ⚠️ هذه مجرد محاكاة – المخترق الحقيقي يمكنه جمع معلومات أكثر (ملفات تعريف الارتباط، كلمات المرور، الموقع الجغرافي، والكاميرا)
    </div>
    <div class="footer">
        ورشة الأمن السيبراني – جميع الحقوق محفوظة © 2026
    </div>
</div>

<script>
    // ====== جمع المعلومات ======
    const ua = navigator.userAgent;

    // 1. نظام التشغيل
    let os = 'غير معروف';
    if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
    else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
    else if (ua.includes('Mac OS X')) os = 'macOS';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
    else if (ua.includes('Linux')) os = 'Linux';

    // 2. المتصفح
    let browser = 'غير معروف';
    if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Google Chrome';
    else if (ua.includes('Firefox')) browser = 'Mozilla Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Microsoft Edge';
    else if (ua.includes('Opera') || ua.includes('OPR')) browser = 'Opera';

    // 3. نوع الجهاز
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
    const device = isMobile ? '📱 جوال / جهاز لوحي' : '💻 كمبيوتر / لابتوب';

    // 4. اللغة
    const lang = navigator.language || navigator.languages?.[0] || 'غير معروف';

    // 5. الوقت والتاريخ
    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', { hour12: true });

    // 6. دقة الشاشة
    const screenRes = `${window.screen.width} × ${window.screen.height}`;

    // 7. عمق الألوان
    const colorDepth = `${window.screen.colorDepth} بت`;

    // 8. ذاكرة المتصفح (إن وجدت)
    const memory = navigator.deviceMemory ? `${navigator.deviceMemory} جيجابايت` : 'غير متاحة';

    // 9. عدد النوى (إن وجد)
    const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} نواة` : 'غير متاح';

    // 10. وقت المنطقة الزمنية
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // 11. هل الجهاز يعمل بالبطارية؟ (معلومة متقدمة)
    let batteryInfo = 'غير متاحة';
    if (navigator.getBattery) {
        navigator.getBattery().then(b => {
            document.getElementById('battery').textContent = `${Math.round(b.level * 100)}% (${b.charging ? '🔌 شحن' : '🔋 بطارية'})`;
        }).catch(() => {});
    }

    // 12. نوع الاتصال (تقريبي)
    let connectionType = 'غير معروف';
    if (navigator.connection) {
        const c = navigator.connection;
        connectionType = c.effectiveType || c.type || 'غير معروف';
    }

    // ====== عرض المعلومات ======
    const data = [
        { label: 'نظام التشغيل', value: os, cls: '' },
        { label: 'المتصفح', value: browser, cls: '' },
        { label: 'نوع الجهاز', value: device, cls: '' },
        { label: 'اللغة', value: lang, cls: '' },
        { label: 'التوقيت المحلي', value: timeStr, cls: '' },
        { label: 'دقة الشاشة', value: screenRes, cls: '' },
        { label: 'عمق الألوان', value: colorDepth, cls: '' },
        { label: 'الذاكرة المتاحة', value: memory, cls: '' },
        { label: 'عدد النوى', value: cores, cls: '' },
        { label: 'المنطقة الزمنية', value: timezone, cls: '' },
        { label: 'نوع الاتصال', value: connectionType, cls: '' },
        { label: 'البطارية', value: '⏳ جارٍ الجلب...', cls: '', id: 'battery' }
    ];

    const grid = document.getElementById('infoGrid');
    data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `card ${index === data.length - 1 ? 'full' : ''}`;
        div.innerHTML = `
            <div class="label">${item.label}</div>
            <div class="value ${item.cls}" ${item.id ? `id="${item.id}"` : ''}>${item.value}</div>
        `;
        grid.appendChild(div);
    });

    // ====== جلب الـ IP ======
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(d => {
            const ipCard = document.createElement('div');
            ipCard.className = 'card full';
            ipCard.style.borderLeftColor = '#58a6ff';
            ipCard.innerHTML = `
                <div class="label">🌐 عنوان IP العام</div>
                <div class="value ip">${d.ip}</div>
            `;
            grid.appendChild(ipCard);
        })
        .catch(() => {
            const ipCard = document.createElement('div');
            ipCard.className = 'card full';
            ipCard.style.borderLeftColor = '#ff6b6b';
            ipCard.innerHTML = `
                <div class="label">🌐 عنوان IP العام</div>
                <div class="value danger">تعذر الحصول على IP</div>
            `;
            grid.appendChild(ipCard);
        });

    // ====== تحديث البطارية بعد ثانية ======
    if (navigator.getBattery) {
        navigator.getBattery().then(b => {
            const el = document.getElementById('battery');
            if (el) el.textContent = `${Math.round(b.level * 100)}% (${b.charging ? '🔌 شحن' : '🔋 بطارية'})`;
        }).catch(() => {});
    }
</script>
</body>
</html>
