<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول إلى عالم الاختراق</title>
    <style>
        /* ===== إعادة تعيين ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0e14;
            color: #c9d1d9;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== الصفحة الأولى (الهيرو) ===== */
        #page-hero {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #page-hero.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        /* خلفية المصفوفة (تأثير بصري) */
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            opacity: 0.15;
        }
        .matrix-bg span {
            position: absolute;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 22px;
            animation: fall linear infinite;
            white-space: nowrap;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }
        .hero-content h1 {
            font-size: 52px;
            font-weight: 900;
            color: #ff4d4d;
            text-shadow: 0 0 40px rgba(255, 77, 77, 0.5);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .hero-content p {
            font-size: 18px;
            color: #8b949e;
            margin-bottom: 35px;
        }
        .hero-content .sub-text {
            font-size: 14px;
            color: #ff6b6b;
            background: #1e0f0f;
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid #ff4d4d33;
            display: inline-block;
            margin-bottom: 30px;
        }

        /* زر الدخول */
        .enter-btn {
            background: #ff4d4d;
            color: #fff;
            border: none;
            padding: 18px 60px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 60px rgba(255, 77, 77, 0.4);
            letter-spacing: 2px;
        }
        .enter-btn:hover {
            background: #ff3333;
            transform: scale(1.05);
            box-shadow: 0 0 80px rgba(255, 77, 77, 0.6);
        }
        .enter-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== الصفحة الثانية (البيانات) ===== */
        #page-data {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: #0a0e14;
            padding: 20px;
            display: none;
            z-index: 50;
        }
        #page-data.active {
            display: block;
        }

        .data-container {
            max-width: 750px;
            margin: 20px auto;
            background: #0d1117;
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid #2a3340;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.08);
        }
        .data-container h1 {
            text-align: center;
            color: #ff4d4d;
            font-size: 28px;
            border-bottom: 2px solid #2a3340;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .data-container .sub-badge {
            display: block;
            text-align: center;
            color: #ff6b6b;
            background: #1e1a2b;
            padding: 6px 0;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 25px;
            border: 1px dashed #ff6b6b44;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background: #0f161c;
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 4px solid #f0883e;
        }
        .card .label {
            font-size: 11px;
            color: #7a8696;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            color: #e6edf3;
        }
        .full {
            grid-column: span 2;
        }

        .camera-section {
            margin: 20px 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #video {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            border: 2px solid #2a3340;
            background: #000;
            transform: scaleX(-1);
            display: none;
        }
        #captured-image {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            border: 2px solid #ff4d4d55;
            transform: scaleX(-1);
            display: block;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }
        .photo-notice {
            font-size: 13px;
            color: #ff6b6b;
            background: #1e0f0f;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #ff4d4d33;
        }

        .warning-box {
            background: #1e0f0f;
            border: 1px solid #ff3b3b55;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0 10px;
            text-align: center;
            color: #ff8a8a;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5a6a;
            margin-top: 20px;
            border-top: 1px solid #1a222a;
            padding-top: 15px;
        }
        @media (max-width: 550px) {
            .grid { grid-template-columns: 1fr; }
            .full { grid-column: span 1; }
        }

        /* ===== رسالة تحميل ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(8px);
        }
        .loading-overlay.show {
            display: flex;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #2a3340;
            border-top: 4px solid #ff4d4d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-overlay h2 {
            color: #ff6b6b;
            font-size: 24px;
        }
    </style>
</head>
<body>

<!-- ===== طبقة التحميل ===== -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <h2>⏳  جار الدخول </h2>
</div>

<!-- ===== الصفحة الأولى (الهيرو) ===== -->
<div id="page-hero">
    <div class="matrix-bg" id="matrixBg"></div>
    <div class="hero-content">
        <div class="sub-text">⚡ بيئة اختبار أمني</div>
        <h1>دخول إلى عالم<br>الاختراق</h1>
        <p>هذه محاكاة توعوية – اضغط للبدء</p>
        <button class="enter-btn" id="enterBtn">🚀 دخول</button>
    </div>
</div>

<!-- ===== الصفحة الثانية (البيانات) ===== -->
<div id="page-data">
    <div class="data-container">
        <h1>⚠️ تنبيه أمني</h1>
        <span class="sub-badge">🔍 تم جمع هذه البيانات من جهازك</span>

        <div class="grid" id="infoGrid"></div>

        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <img id="captured-image" alt="تم التقاط صورتك تلقائياً">
            <span class="photo-notice">📸 تم التقاط صورة من كاميرتك الأمامية</span>
        </div>

        <div class="warning-box">
            ⚡ هذه مجرد محاكاة – المخترق الحقيقي يمكنه تشغيل كاميرتك وميكروفونك دون علمك
        </div>
        <div class="footer">cybernestsec © 2026</div>
    </div>
</div>

<script>
    // ==========================================
    // 1. تأثير المصفوفة (خلفية الهيرو)
    // ==========================================
    const matrixBg = document.getElementById('matrixBg');
    for (let i = 0; i < 30; i++) {
        const span = document.createElement('span');
        span.textContent = Math.random() > 0.5 ? '1' : '0';
        span.style.left = Math.random() * 100 + '%';
        span.style.fontSize = (Math.random() * 20 + 14) + 'px';
        span.style.animationDuration = (Math.random() * 8 + 6) + 's';
        span.style.animationDelay = (Math.random() * 8) + 's';
        matrixBg.appendChild(span);
    }

    // ==========================================
    // 2. زر الدخول
    // ==========================================
    const enterBtn = document.getElementById('enterBtn');
    const pageHero = document.getElementById('page-hero');
    const pageData = document.getElementById('page-data');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const video = document.getElementById('video');
    const capturedImg = document.getElementById('captured-image');

    enterBtn.addEventListener('click', async function() {
        // تعطيل الزر
        this.disabled = true;
        this.textContent = '⏳ جارٍ الدخول...';
        loadingOverlay.classList.add('show');

        try {
            // طلب الكاميرا مباشرة (بدون إشعارات)
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
            });

            // إخفاء التحميل
            loadingOverlay.classList.remove('show');

            // إخفاء صفحة الهيرو وإظهار صفحة البيانات
            pageHero.classList.add('hidden');
            pageData.classList.add('active');

            // تشغيل الكاميرا والتصوير
            video.style.display = 'block';
            video.srcObject = stream;
            await new Promise(resolve => setTimeout(resolve, 500));

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImg.src = canvas.toDataURL('image/png');

            // إيقاف الكاميرا
            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            video.style.display = 'none';

        } catch (err) {
            // فشل الكاميرا أو رفض المستخدم
            loadingOverlay.classList.remove('show');
            alert('⚠️ تم رفض الوصول إلى الكاميرا. لا يمكن المتابعة.');
            this.disabled = false;
            this.textContent = '🚀 دخول';
        }
    });

    // ==========================================
    // 3. جمع المعلومات وعرضها (صفحة البيانات)
    // ==========================================
    const ua = navigator.userAgent;

    const os = (() => {
        if (ua.includes('Windows NT 10.0')) return 'Windows 10/11';
        if (ua.includes('Windows NT 6.1')) return 'Windows 7';
        if (ua.includes('Mac OS X')) return 'macOS';
        if (ua.includes('Android')) return 'Android';
        if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
        if (ua.includes('Linux')) return 'Linux';
        return 'غير معروف';
    })();

    const browser = (() => {
        if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Google Chrome';
        if (ua.includes('Firefox')) return 'Mozilla Firefox';
        if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
        if (ua.includes('Edg')) return 'Microsoft Edge';
        if (ua.includes('Opera') || ua.includes('OPR')) return 'Opera';
        return 'غير معروف';
    })();

    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', { hour12: true });
    const screenRes = `${window.screen.width} × ${window.screen.height}`;
    const colorDepth = `${window.screen.colorDepth} بت`;
    const memory = navigator.deviceMemory ? `${navigator.deviceMemory} جيجابايت` : 'غير متاحة';
    const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} نواة` : 'غير متاح';
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    let isPrivate = 'غير معروف';
    if (navigator.webdriver) {
        isPrivate = 'ربما (متصفح آلي)';
    } else {
        try {
            const fs = window.RequestFileSystem || window.webkitRequestFileSystem;
            if (!fs) isPrivate = 'ربما (غير مدعوم)';
        } catch { isPrivate = 'محتمل'; }
    }

    let batteryInfo = '⏳ جارٍ الجلب...';
    if (navigator.getBattery) {
        navigator.getBattery().then(b => {
            batteryInfo = `${Math.round(b.level * 100)}% (${b.charging ? '🔌 شحن' : '🔋 بطارية'})`;
            const el = document.getElementById('battery');
            if (el) el.textContent = batteryInfo;
        }).catch(() => { batteryInfo = 'غير متاحة'; });
    }

    let connectionType = 'غير معروف';
    if (navigator.connection) {
        const c = navigator.connection;
        connectionType = c.effectiveType || c.type || 'غير معروف';
    }

    const data = [
        { label: 'نظام التشغيل', value: os },
        { label: 'المتصفح', value: browser },
        { label: 'التوقيت المحلي', value: timeStr },
        { label: 'دقة الشاشة', value: screenRes },
        { label: 'عمق الألوان', value: colorDepth },
        { label: 'الذاكرة (RAM)', value: memory },
        { label: 'عدد النوى', value: cores },
        { label: 'المنطقة الزمنية', value: timezone },
        { label: 'نوع الاتصال', value: connectionType },
        { label: 'وضع التصفح', value: isPrivate },
        { label: 'البطارية', value: batteryInfo, id: 'battery' }
    ];

    const grid = document.getElementById('infoGrid');
    data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `card ${index === data.length - 1 ? 'full' : ''}`;
        div.innerHTML = `
            <div class="label">${item.label}</div>
            <div class="value" ${item.id ? `id="${item.id}"` : ''}>${item.value}</div>
        `;
        grid.appendChild(div);
    });
</script>
</body>
</html>
